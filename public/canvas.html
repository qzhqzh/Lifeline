<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Lifeline 项目协作画布：与项目参与者实时共同绘图。" />
    <title>Lifeline · 项目协作画布</title>
    <link rel="icon" type="image/png" href="/assets/lifeline-logo-64.png" />
    <link rel="stylesheet" href="/client.css" />
    <link rel="stylesheet" href="/canvas.css" />
  </head>
  <body class="canvas-shell">
    <!--
    THESIS: The project canvas is the work itself; Lifeline chrome keeps context without shrinking it into a dashboard card.
    OWN-WORLD: Existing navy control-plane shell, mint state accents, compact squared controls, and a light drawing field owned by WBO.
    STORY: Pick the project, enter its one shared board, draw immediately, and rely on the task board for formal schedule state.
    FIRST VIEWPORT: One restrained 70px project bar above a border-contained canvas that consumes every remaining pixel; failure replaces only the canvas.
    FORM: Established-world Operate surface, direct full-viewport editor extension, seed lifeline-canvas-wbo-v1.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <header class="client-topbar canvas-topbar">
      <a class="client-brand" href="/" aria-label="返回 Lifeline 控制平面">
        <img src="/assets/lifeline-logo.webp" alt="" width="34" height="34" />
        <strong>Lifeline</strong>
      </a>

      <label class="project-picker">
        <span class="visually-hidden">切换项目</span>
        <select id="projectSelect" aria-label="切换协作画布项目"></select>
        <svg aria-hidden="true" viewBox="0 0 20 20"><path d="m6 8 4 4 4-4" /></svg>
      </label>

      <nav class="client-nav" aria-label="客户项目导航">
        <a id="projectProgressNavLink" href="/client.html">项目进度</a>
        <a id="testMapNavLink" href="/test-map.html">测试地图</a>
        <a class="active" id="canvasNavLink" href="/canvas.html" aria-current="page">协作画布</a>
      </nav>

      <div class="client-topbar-actions">
        <button class="canvas-context-toggle" id="canvasContextToggle" type="button" aria-controls="canvasContextPanel" aria-expanded="false">
          项目对象
          <span id="canvasContextCount" aria-hidden="true"></span>
        </button>
      </div>
    </header>

    <main class="canvas-stage" aria-live="polite">
      <section class="canvas-surface" aria-label="项目协作画布">
        <iframe
          id="canvasFrame"
          title="项目协作画布"
          referrerpolicy="no-referrer"
          allow="clipboard-read; clipboard-write"
        ></iframe>
        <div class="canvas-status" id="canvasStatus" data-state="loading">
          <span class="canvas-status-mark" aria-hidden="true"></span>
          <strong id="canvasStatusTitle">正在连接协作画布</strong>
          <p id="canvasStatusDetail"></p>
          <button class="button primary" id="retryCanvas" type="button" hidden>重新连接</button>
        </div>
      </section>

      <aside class="canvas-context-panel" id="canvasContextPanel" aria-label="画布项目对象" aria-hidden="true">
        <header class="canvas-context-head">
          <div>
            <strong>项目对象</strong>
            <span id="canvasAccessRole"></span>
          </div>
          <button class="canvas-panel-close" id="canvasContextClose" type="button" aria-label="关闭项目对象">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></svg>
          </button>
        </header>
        <div class="canvas-context-scroll">
          <section class="canvas-context-section" aria-labelledby="canvasObjectsTitle">
            <div class="canvas-section-head">
              <h2 id="canvasObjectsTitle">可关联对象</h2>
              <span id="canvasBindingCount"></span>
            </div>
            <div class="canvas-object-list" id="canvasObjectList"></div>
          </section>

          <section class="canvas-context-section" id="canvasChangeSection" aria-labelledby="canvasChangesTitle">
            <div class="canvas-section-head">
              <h2 id="canvasChangesTitle">排期提议</h2>
              <span id="canvasProposalCount"></span>
            </div>
            <form class="canvas-change-form" id="canvasChangeForm">
              <label>任务<select id="canvasChangeTask" required></select></label>
              <div class="canvas-form-row">
                <label>阶段<select id="canvasChangePhase" required></select></label>
                <label>泳道<select id="canvasChangeStatus" required>
                  <option value="pending">待确认</option>
                  <option value="scheduled">已排期</option>
                  <option value="running">进行中</option>
                  <option value="review">待验收</option>
                </select></label>
              </div>
              <label>原因<input id="canvasChangeReason" maxlength="1000" required placeholder="说明为什么调整" /></label>
              <button type="submit">提交提议</button>
            </form>
            <div class="canvas-proposal-list" id="canvasProposalList"></div>
          </section>

          <section class="canvas-context-section" id="canvasShareSection" aria-labelledby="canvasShareTitle">
            <div class="canvas-section-head"><h2 id="canvasShareTitle">共享访问</h2></div>
            <form class="canvas-share-form" id="canvasShareForm">
              <label>访问者<input id="canvasShareName" maxlength="120" required placeholder="客户或负责人名称" /></label>
              <label>权限<select id="canvasShareRole">
                <option value="EDITOR">协作编辑</option>
                <option value="VIEWER">仅看项目</option>
                <option value="MANAGER">负责人</option>
              </select></label>
              <button type="submit">生成链接</button>
            </form>
            <div class="canvas-share-result" id="canvasShareResult" hidden>
              <input id="canvasShareUrl" readonly aria-label="项目共享链接" />
              <button id="copyCanvasShareUrl" type="button">复制</button>
            </div>
          </section>
        </div>
      </aside>
    </main>

    <div class="client-toast canvas-toast" id="canvasToast" role="status" aria-live="polite"></div>

    <script type="module" src="/canvas.js"></script>
  </body>
</html>
